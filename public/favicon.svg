<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background for better visibility -->
  <rect width="100" height="100" rx="18" fill="white"/>

  <!-- Thread spool -->
  <g>
    <!-- Top rim -->
    <ellipse cx="50" cy="28" rx="18" ry="5" fill="hsl(174, 80%, 26%)"/>
    <path d="M 32 28 L 32 33 Q 32 36 50 36 Q 68 36 68 33 L 68 28" fill="hsl(174, 70%, 22%)"/>

    <!-- Spool body -->
    <rect x="40" y="31" width="20" height="38" fill="hsl(174, 70%, 22%)"/>

    <!-- Thread wrapping lines -->
    <line x1="38" y1="38" x2="62" y2="38" stroke="hsl(174, 80%, 26%)" stroke-width="1.5" opacity="0.7"/>
    <line x1="38" y1="42" x2="62" y2="42" stroke="hsl(174, 80%, 26%)" stroke-width="1.5" opacity="0.7"/>
    <line x1="38" y1="46" x2="62" y2="46" stroke="hsl(174, 80%, 26%)" stroke-width="1.5" opacity="0.7"/>
    <line x1="38" y1="50" x2="62" y2="50" stroke="hsl(174, 80%, 26%)" stroke-width="1.5" opacity="0.7"/>
    <line x1="38" y1="54" x2="62" y2="54" stroke="hsl(174, 80%, 26%)" stroke-width="1.5" opacity="0.7"/>
    <line x1="38" y1="58" x2="62" y2="58" stroke="hsl(174, 80%, 26%)" stroke-width="1.5" opacity="0.7"/>
    <line x1="38" y1="62" x2="62" y2="62" stroke="hsl(174, 80%, 26%)" stroke-width="1.5" opacity="0.7"/>

    <!-- Bottom rim -->
    <path d="M 32 69 L 32 74 Q 32 77 50 77 Q 68 77 68 74 L 68 69" fill="hsl(174, 70%, 22%)"/>
    <ellipse cx="50" cy="69" rx="18" ry="5" fill="hsl(174, 80%, 26%)"/>

    <!-- Needle -->
    <g transform="rotate(-35 50 50)">
      <ellipse cx="72" cy="38" rx="2.5" ry="2" fill="hsl(220, 9%, 46%)" opacity="0.9"/>
      <rect x="70.8" y="40" width="2.4" height="32" fill="hsl(220, 9%, 46%)"/>
      <path d="M 72 72 L 70 76 L 74 76 Z" fill="hsl(220, 9%, 46%)"/>
    </g>

    <!-- Thread from needle -->
    <path d="M 63 48 Q 68 53 70 61" stroke="hsl(174, 80%, 26%)" stroke-width="1.8" fill="none" opacity="0.8"/>
  </g>
</svg>
