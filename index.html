<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/assets/spool/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/assets/spool/spool-icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/spool/spool-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/spool/spool-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/spool/spool-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/spool/spool-180.png" />

    <!-- Sitemap reference -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Static fallback meta tags (overridden by react-helmet-async when JS loads) -->
    <title>OpenThreads - Compliance-first product data infrastructure</title>
    <meta name="description" content="Structured systems that make product compliance auditable, exportable, and operational." />
    <meta name="author" content="OpenThreads" />

    <meta property="og:title" content="OpenThreads - Compliance-first product data infrastructure" />
    <meta property="og:description" content="Structured systems that make product compliance auditable, exportable, and operational." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://openthreads.dev/assets/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@openthreads" />
    <meta name="twitter:image" content="https://openthreads.dev/assets/og-image.png" />

    <script defer src="https://cloud.umami.is/script.js" data-website-id="f718f716-0b9e-4164-b3b0-7e65df928f94"></script>
  </head>

  <body>
    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="contact" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
